<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>VR камера — миры</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }
  #screen { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px; }
  button { font-size: 20px; padding: 12px 22px; border: 0; border-radius: 14px; background: #333; color: #fff; font-weight: bold; }
  button.on { background: #3c3; color: #000; }
  #go { background: #3c3; color: #000; font-size: 24px; padding: 16px 40px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #settings { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.8); padding: 10px 14px; border-radius: 14px; display: none; flex-direction: column; gap: 8px; align-items: center; font-size: 16px; }
  #settings button { font-size: 16px; padding: 8px 14px; }
  #err { color: #f66; max-width: 420px; }
  video { display: none; }
</style>
</head>
<body>
<div id="start">
  <div style="font-size:28px;font-weight:bold">VR камера 👓</div>
  <div>Выбери мир:</div>
  <div class="row themes">
    <button data-t="blocks">🟩 Блоки</button>
    <button data-t="cafe">☕ Кафе</button>
    <button data-t="space">🚀 Космос</button>
    <button data-t="ocean">🐠 Под водой</button>
    <button data-t="real">📷 Обычно</button>
  </div>
  <div>Поверни телефон горизонтально, нажми «Старт»<br>и вставь телефон в очки.</div>
  <button id="go">Старт</button>
  <div id="err"></div>
</div>

<canvas id="screen"></canvas>
<video id="video" autoplay playsinline muted></video>

<div id="settings">
  <div class="row themes">
    <button data-t="blocks">🟩 Блоки</button>
    <button data-t="cafe">☕ Кафе</button>
    <button data-t="space">🚀 Космос</button>
    <button data-t="ocean">🐠 Под водой</button>
    <button data-t="real">📷 Обычно</button>
  </div>
  <div class="row">
    Размер: <button id="minus">−</button><button id="plus">+</button>
    Блоки: <button id="bmore">мельче</button><button id="bless">крупнее</button>
    <button id="hide" style="background:#3c3;color:#000">OK</button>
  </div>
</div>

<script>
const video = document.getElementById('video');
const screenC = document.getElementById('screen');
const ctx = screenC.getContext('2d');
const proc = document.createElement('canvas');
const pctx = proc.getContext('2d', { willReadFrequently: true });
const settings = document.getElementById('settings');

let theme = 'blocks';
let cols = 20;
let size = 90;
try { theme = localStorage.getItem('vrTheme') || 'blocks'; cols = Number(localStorage.getItem('vrCols')) || 20; size = Number(localStorage.getItem('vrSize')) || 90; } catch (e) {}

function save() { try { localStorage.setItem('vrTheme', theme); localStorage.setItem('vrSize', size); localStorage.setItem('vrCols', cols); } catch (e) {} }

function markThemes() {
  document.querySelectorAll('.themes button').forEach(b => b.classList.toggle('on', b.dataset.t === theme));
}
document.querySelectorAll('.themes button').forEach(b => b.onclick = (ev) => { ev.stopPropagation(); theme = b.dataset.t; save(); markThemes(); });
markThemes();

// Цвета миров: 5 уровней яркости + цвет линий (контуров стен и мебели)
const PALETTES = {
  cafe:  { levels: [[40,22,14],[92,52,30],[150,95,55],[205,155,100],[245,220,180]], edge: [25,12,6] },
  space: { levels: [[6,4,24],[28,18,78],[68,38,140],[120,90,205],[205,195,255]], edge: [0,255,235] },
  ocean: { levels: [[2,20,42],[5,60,92],[10,110,130],[60,170,180],[185,240,230]], edge: [225,255,255] }
};

// Случайные объекты (координаты 0..1, чтобы подходили под любой размер)
const rnd = Math.random;
const stars = Array.from({length: 70}, () => ({ x: rnd(), y: rnd(), p: rnd() * 6 }));
const bubbles = Array.from({length: 25}, () => ({ x: rnd(), y: rnd(), r: 0.005 + rnd() * 0.015, s: 0.03 + rnd() * 0.06 }));
const fishes = Array.from({length: 5}, () => ({ x: rnd(), y: 0.15 + rnd() * 0.6, s: (rnd() < 0.5 ? -1 : 1) * (0.03 + rnd() * 0.05), c: ['#ff8a00','#ffd400','#ff4fa0','#5fd4ff','#9dff5f'][Math.floor(rnd()*5)], k: 0.6 + rnd() * 0.6 }));
const people = Array.from({length: 4}, (_, i) => ({ x: rnd(), s: (i % 2 ? -1 : 1) * (0.02 + rnd() * 0.03), k: 0.7 + rnd() * 0.5, y: 0.62 + rnd() * 0.12 }));


// ===== Мир из блоков =====
// Свои пиксельные текстуры 16x16, нарисованные кодом
function makeTex(seed, fn) {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const x = c.getContext('2d'); const im = x.createImageData(16, 16);
  let s = seed;
  const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let py = 0; py < 16; py++) for (let px = 0; px < 16; px++) {
    let [R, G, B] = fn(px, py, r);
    if (px === 0 || py === 0 || px === 15 || py === 15) { R *= 0.72; G *= 0.72; B *= 0.72; } // рамка блока
    const j = (py * 16 + px) * 4;
    im.data[j] = R; im.data[j+1] = G; im.data[j+2] = B; im.data[j+3] = 255;
  }
  x.putImageData(im, 0, 0);
  return c;
}
const grassDepth = Array.from({length: 16}, (_, i) => 3 + ((i * 7) % 3 === 0 ? 1 : 0) + (i % 5 === 0 ? 1 : 0));
const TEX = {
  grass: makeTex(11, (x, y, r) => {
    const k = 0.8 + r() * 0.35;
    if (y < grassDepth[x]) return [90 * k, 165 * k, 55 * k];
    return [134 * k, 96 * k, 67 * k];
  }),
  dirt: makeTex(22, (x, y, r) => { const k = 0.75 + r() * 0.4; return [134 * k, 96 * k, 67 * k]; }),
  stone: makeTex(33, (x, y, r) => {
    let k = 0.82 + r() * 0.3; if (r() < 0.07) k *= 0.7;
    return [128 * k, 128 * k, 130 * k];
  }),
  planks: makeTex(44, (x, y, r) => {
    let k = 0.85 + r() * 0.2;
    if (y % 4 === 3) k *= 0.7;
    const seam = (Math.floor(y / 4) % 2) ? 4 : 12;
    if (x === seam) k *= 0.75;
    return [170 * k, 133 * k, 80 * k];
  }),
  brick: makeTex(55, (x, y, r) => {
    const row = Math.floor(y / 4), off = row % 2 ? 4 : 0;
    if (y % 4 === 3 || (x + off) % 8 === 7) return [185, 180, 170];
    const k = 0.8 + r() * 0.3; return [155 * k, 70 * k, 55 * k];
  }),
  water: makeTex(66, (x, y, r) => {
    const k = 0.8 + r() * 0.3 + (Math.sin((x + y) * 0.8) > 0.6 ? 0.15 : 0);
    return [55 * k, 95 * k, 210 * k];
  }),
  leaves: makeTex(77, (x, y, r) => {
    const k = r() < 0.2 ? 0.45 : 0.8 + r() * 0.35;
    return [55 * k, 130 * k, 40 * k];
  })
};

let cellStats = null, statW = 0, statH = 0;
const blockCanvas = document.createElement('canvas');
const bctx = blockCanvas.getContext('2d');

function buildBlocks(rw, rh) {
  const rows = Math.max(6, Math.round(cols * rh / rw));
  const S = 4; // 4x4 точки на каждый блок
  const pw = cols * S, ph = rows * S;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return false;
  const want = pw / ph;
  let sw = vw, sh = vw / want;
  if (sh > vh) { sh = vh; sw = vh * want; }
  if (proc.width !== pw || proc.height !== ph) { proc.width = pw; proc.height = ph; }
  pctx.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, pw, ph);
  const d = pctx.getImageData(0, 0, pw, ph).data;
  const lum = new Float32Array(pw * ph);
  for (let i = 0; i < pw * ph; i++) lum[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2];

  if (!cellStats || statW !== cols || statH !== rows) {
    cellStats = Array.from({length: cols * rows}, () => ({ r: 128, g: 128, b: 128, l: 128, e: 0, type: 'stone' }));
    statW = cols; statH = rows;
  }
  for (let cy = 0; cy < rows; cy++) for (let cx = 0; cx < cols; cx++) {
    let R = 0, G = 0, B = 0, L = 0, E = 0;
    for (let yy = 0; yy < S; yy++) for (let xx = 0; xx < S; xx++) {
      const x = cx * S + xx, y = cy * S + yy, i = y * pw + x;
      R += d[i*4]; G += d[i*4+1]; B += d[i*4+2]; L += lum[i];
      if (x > 0 && y > 0 && x < pw - 1 && y < ph - 1) {
        E += Math.abs(lum[i+1] - lum[i-1]) + Math.abs(lum[i+pw] - lum[i-pw]);
      }
    }
    const n = S * S, st = cellStats[cy * cols + cx], a = 0.25; // плавность, чтобы блоки не мигали
    st.r += (R/n - st.r) * a; st.g += (G/n - st.g) * a; st.b += (B/n - st.b) * a;
    st.l += (L/n - st.l) * a; st.e += (E/n - st.e) * a;

    const mx = Math.max(st.r, st.g, st.b), mn = Math.min(st.r, st.g, st.b), sat = mx - mn;
    let t;
    if (sat > 55 && st.b === mx) t = 'water';
    else if (sat > 90 && st.r === mx && st.g < st.r * 0.6) t = 'brick'; // красное
    else if (sat > 40 && st.r === mx) t = 'planks';                       // дерево, коричневое
    else if (sat > 45 && st.g === mx) t = 'leaves';
    else if (st.e > 28) t = 'grass';      // предметы: обувь, стулья, игрушки
    else if (st.l > 140) t = 'stone';     // светлые ровные места — стены
    else if (st.l > 75) t = 'planks';     // средние — пол, двери
    else t = 'dirt';                       // тёмное
    st.type = t;
  }

  // Рисуем блоки в отдельный холст (один раз), потом копируем на оба глаза
  const B = 16;
  if (blockCanvas.width !== cols * B || blockCanvas.height !== rows * B) { blockCanvas.width = cols * B; blockCanvas.height = rows * B; }
  bctx.imageSmoothingEnabled = false;
  for (let cy = 0; cy < rows; cy++) for (let cx = 0; cx < cols; cx++) {
    const st = cellStats[cy * cols + cx];
    bctx.drawImage(TEX[st.type], cx * B, cy * B);
    const f = Math.max(0.5, Math.min(1.3, st.l / 135)); // тени и свет как в комнате
    if (f < 1) { bctx.fillStyle = `rgba(0,0,0,${1 - f})`; bctx.fillRect(cx * B, cy * B, B, B); }
    else { bctx.fillStyle = `rgba(255,255,255,${(f - 1) * 0.5})`; bctx.fillRect(cx * B, cy * B, B, B); }
  }
  return true;
}

let last = performance.now();

function processFrame(pw, ph) {
  // Вырезаем из камеры кусок нужной формы (по центру)
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return false;
  const want = pw / ph;
  let sw = vw, sh = vw / want;
  if (sh > vh) { sh = vh; sw = vh * want; }
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  if (proc.width !== pw || proc.height !== ph) { proc.width = pw; proc.height = ph; }
  pctx.drawImage(video, sx, sy, sw, sh, 0, 0, pw, ph);
  if (theme === 'real') return true;

  const img = pctx.getImageData(0, 0, pw, ph);
  const d = img.data;
  const n = pw * ph;
  const lum = new Float32Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) lum[i] = 0.299 * d[j] + 0.587 * d[j+1] + 0.114 * d[j+2];
  const pal = PALETTES[theme];
  for (let y = 0; y < ph; y++) {
    for (let x = 0; x < pw; x++) {
      const i = y * pw + x, j = i * 4;
      let mag = 0;
      if (x > 0 && y > 0 && x < pw - 1 && y < ph - 1) {
        // Ищем края предметов (стены, двери, мебель)
        const gx = -lum[i-pw-1] - 2*lum[i-1] - lum[i+pw-1] + lum[i-pw+1] + 2*lum[i+1] + lum[i+pw+1];
        const gy = -lum[i-pw-1] - 2*lum[i-pw] - lum[i-pw+1] + lum[i+pw-1] + 2*lum[i+pw] + lum[i+pw+1];
        mag = Math.abs(gx) + Math.abs(gy);
      }
      let c;
      if (mag > 110) c = pal.edge;
      else c = pal.levels[Math.min(4, Math.floor(lum[i] / 256 * 5))];
      d[j] = c[0]; d[j+1] = c[1]; d[j+2] = c[2];
    }
  }
  pctx.putImageData(img, 0, 0);
  return true;
}

function drawCafe(x, y, w, h, t) {
  // Тёплый свет
  const g = ctx.createRadialGradient(x + w/2, y + h*0.3, h*0.1, x + w/2, y + h/2, h*0.8);
  g.addColorStop(0, 'rgba(255,190,90,0.18)');
  g.addColorStop(1, 'rgba(30,10,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);

  // Люди-силуэты ходят по кафе
  for (const p of people) {
    const px = x + p.x * w, base = y + p.y * h, s = h * 0.32 * p.k;
    const step = Math.sin(t * 6 + p.x * 20) * s * 0.04;
    ctx.fillStyle = 'rgba(25,12,5,0.55)';
    ctx.beginPath(); ctx.arc(px, base - s * 0.85 + step, s * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px, base - s * 0.45 + step, s * 0.16, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    // чашка в руке
    ctx.fillStyle = 'rgba(255,240,220,0.7)';
    ctx.fillRect(px + s * 0.15 * Math.sign(p.s), base - s * 0.5 + step, s * 0.07, s * 0.08);
  }

  // Лампы на потолке
  for (let i = 0; i < 3; i++) {
    const lx = x + w * (0.2 + i * 0.3) + Math.sin(t * 1.3 + i) * w * 0.01;
    const ly = y + h * 0.16;
    ctx.strokeStyle = 'rgba(20,10,5,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + w * (0.2 + i * 0.3), y); ctx.lineTo(lx, ly); ctx.stroke();
    const glow = ctx.createRadialGradient(lx, ly + h*0.03, 1, lx, ly + h*0.03, h * 0.15);
    glow.addColorStop(0, 'rgba(255,220,140,0.9)'); glow.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(lx, ly + h*0.03, h * 0.15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a160c';
    ctx.beginPath(); ctx.moveTo(lx - w*0.04, ly + h*0.03); ctx.lineTo(lx + w*0.04, ly + h*0.03); ctx.lineTo(lx + w*0.015, ly); ctx.lineTo(lx - w*0.015, ly); ctx.closePath(); ctx.fill();
  }

  // Неоновая вывеска
  const flick = Math.sin(t * 17) > -0.9 ? 1 : 0.3;
  ctx.font = `bold ${Math.round(h * 0.07)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ff4fa0'; ctx.shadowBlur = 15 * flick;
  ctx.fillStyle = `rgba(255,120,190,${flick})`;
  ctx.fillText('☕ КАФЕ', x + w / 2, y + h * 0.36);
  ctx.shadowBlur = 0;
}

function drawSpace(x, y, w, h, t) {
  for (const s of stars) {
    const a = 0.4 + 0.6 * Math.abs(Math.sin(t * 2 + s.p));
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fillRect(x + s.x * w, y + s.y * h * 0.5, 2, 2);
  }
  // Планета с кольцом
  const px = x + w * 0.8, py = y + h * 0.18, r = h * 0.08;
  const pg = ctx.createRadialGradient(px - r/3, py - r/3, 1, px, py, r);
  pg.addColorStop(0, '#ffb36b'); pg.addColorStop(1, '#a8402a');
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,230,180,0.8)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(px, py, r * 1.7, r * 0.45, -0.3, 0, Math.PI*2); ctx.stroke();
  // Падающая звезда
  const k = (t * 0.25) % 1;
  if (k < 0.3) {
    const sx = x + w * (0.1 + k * 2), sy = y + h * (0.05 + k * 0.6);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - w*0.08, sy - h*0.04); ctx.stroke();
  }
}

function drawOcean(x, y, w, h, t, dt) {
  // Лучи света сверху
  for (let i = 0; i < 4; i++) {
    const rx = x + w * (0.15 + i * 0.25) + Math.sin(t * 0.5 + i) * w * 0.05;
    const g = ctx.createLinearGradient(rx, y, rx, y + h * 0.8);
    g.addColorStop(0, 'rgba(200,255,255,0.18)'); g.addColorStop(1, 'rgba(200,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(rx - w*0.03, y); ctx.lineTo(rx + w*0.03, y); ctx.lineTo(rx + w*0.1, y + h*0.8); ctx.lineTo(rx - w*0.04, y + h*0.8); ctx.fill();
  }
  // Рыбки
  for (const f of fishes) {
    f.x += f.s * dt;
    if (f.x > 1.15) f.x = -0.15; if (f.x < -0.15) f.x = 1.15;
    const fx = x + f.x * w, fy = y + f.y * h + Math.sin(t * 2 + f.y * 10) * h * 0.01, s = h * 0.05 * f.k, dir = Math.sign(f.s);
    ctx.fillStyle = f.c;
    ctx.beginPath(); ctx.ellipse(fx, fy, s, s * 0.55, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(fx - dir * s * 0.8, fy); ctx.lineTo(fx - dir * s * 1.5, fy - s * 0.5); ctx.lineTo(fx - dir * s * 1.5, fy + s * 0.5); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(fx + dir * s * 0.5, fy - s * 0.1, s * 0.1, 0, Math.PI*2); ctx.fill();
  }
  // Пузырьки
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5;
  for (const b of bubbles) {
    b.y -= b.s * dt; if (b.y < -0.05) { b.y = 1.05; b.x = rnd(); }
    ctx.beginPath(); ctx.arc(x + (b.x + Math.sin(t + b.r * 300) * 0.01) * w, y + b.y * h, b.r * h, 0, Math.PI*2); ctx.stroke();
  }
}

function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const t = now / 1000;
  const W = screenC.clientWidth * devicePixelRatio, H = screenC.clientHeight * devicePixelRatio;
  if (screenC.width !== W || screenC.height !== H) { screenC.width = W; screenC.height = H; }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  const half = W / 2;
  const rw = half * size / 100, rh = H * size / 100;
  const ph = 200, pw = Math.max(50, Math.round(ph * rw / rh));

  // люди двигаются один раз за кадр
  for (const p of people) { p.x += p.s * dt; if (p.x > 1.1) p.x = -0.1; if (p.x < -0.1) p.x = 1.1; }

  if (theme === 'blocks') {
    if (buildBlocks(rw, rh)) {
      for (let eye = 0; eye < 2; eye++) {
        const x = eye * half + (half - rw) / 2, y = (H - rh) / 2;
        ctx.save();
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, rw, rh, 16) : ctx.rect(x, y, rw, rh); ctx.clip();
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(blockCanvas, x, y, rw, rh);
        ctx.restore();
      }
    }
  } else if (processFrame(pw, ph)) {
    for (let eye = 0; eye < 2; eye++) {
      const x = eye * half + (half - rw) / 2, y = (H - rh) / 2;
      ctx.save();
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, rw, rh, 16) : ctx.rect(x, y, rw, rh); ctx.clip();
      ctx.drawImage(proc, x, y, rw, rh);
      if (theme === 'cafe') drawCafe(x, y, rw, rh, t);
      if (theme === 'space') drawSpace(x, y, rw, rh, t);
      if (theme === 'ocean') drawOcean(x, y, rw, rh, t, eye === 0 ? dt : 0);
      ctx.restore();
    }
  }
  requestAnimationFrame(loop);
}

document.getElementById('go').onclick = async () => {
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play().catch(() => {});
    document.getElementById('start').style.display = 'none';
    screenC.style.display = 'block';
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    try { await screen.orientation.lock('landscape'); } catch (e) {}
    try { await navigator.wakeLock.request('screen'); } catch (e) {}
    requestAnimationFrame(loop);
  } catch (e) {
    err.textContent = 'Не получилось включить камеру. Разреши доступ к камере и попробуй снова. (' + e.name + ')';
  }
};

// Нажми на экран — появятся настройки
screenC.onclick = () => { settings.style.display = 'flex'; };
document.getElementById('plus').onclick = () => { size = Math.min(100, size + 5); save(); };
document.getElementById('minus').onclick = () => { size = Math.max(50, size - 5); save(); };
document.getElementById('bmore').onclick = () => { cols = Math.min(40, cols + 4); save(); };
document.getElementById('bless').onclick = () => { cols = Math.max(8, cols - 4); save(); };
document.getElementById('hide').onclick = () => { settings.style.display = 'none'; };
</script>
</body>
</html>
